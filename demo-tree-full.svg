<svg xmlns="http://www.w3.org/2000/svg" id="s" viewBox="0 0 3640 560"><defs><filter id="card-shadow" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#1e3c2d" flood-opacity="0.14"/></filter></defs><g class="zoom-group" transform="translate(1820,80) scale(1)"><g class="content-group"><g class="links"><path class="link lit" d="M0,0C0,70,-1560,70,-1560,140" fill="none" stroke="#2e9e5b" stroke-width="2" stroke-dasharray="none"/><text class="edge-label" x="-780" y="67" text-anchor="middle" font-size="11" fill="#2e7d5b" paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" style="cursor: pointer;">做除法时你会注意到：有的算式刚好除尽（余…<title>做除法时你会注意到：有的算式刚好除尽（余数为 0），有的除不尽——「除得尽」这件事值得专门研究，于是引出了整除与因数。</title></text><path class="link lit" d="M0,0C0,70,-780,70,-780,140" fill="none" stroke="#2e9e5b" stroke-width="2" stroke-dasharray="none"/><text class="edge-label" x="-390" y="67" text-anchor="middle" font-size="11" fill="#2e7d5b" paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" style="cursor: pointer;">学会操作只是第一步，真正掌握要看你会不会…<title>学会操作只是第一步，真正掌握要看你会不会用它解决问题——求公因数、公倍数、约分，都是短除法的主场。</title></text><path class="link lit" d="M0,0C0,70,0,70,0,140" fill="none" stroke="#2e9e5b" stroke-width="2" stroke-dasharray="none"/><text class="edge-label" x="0" y="67" text-anchor="middle" font-size="11" fill="#2e7d5b" paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" style="cursor: pointer;">前面所有概念都汇聚到这里：现在把它们串成…<title>前面所有概念都汇聚到这里：现在把它们串成三步连贯动作，这就是短除法本身。</title></text><path class="link lit" d="M0,0C0,70,780,70,780,140" fill="none" stroke="#2e9e5b" stroke-width="2" stroke-dasharray="none"/><text class="edge-label" x="390" y="67" text-anchor="middle" font-size="11" fill="#2e7d5b" paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" style="cursor: pointer;">短除法是长除法的「精简版」——先看懂长除…<title>短除法是长除法的「精简版」——先看懂长除法完整的试商、乘、减过程，才能明白短除法省掉了哪些步骤、为什么更快。</title></text><path class="link lit" d="M0,0C0,70,1560,70,1560,140" fill="none" stroke="#2e9e5b" stroke-width="2" stroke-dasharray="none"/><text class="edge-label" x="780" y="67" text-anchor="middle" font-size="11" fill="#2e7d5b" paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" style="cursor: pointer;">短除法本质是一连串除法运算——每一步都在…<title>短除法本质是一连串除法运算——每一步都在「除以一个数」。先把除法本身彻底弄懂，后面的符号和步骤才不会陌生。</title></text><path class="link" d="M-1560,140C-1560,210,-1690,210,-1690,280" fill="none" stroke="#c6d2cc" stroke-width="1.5" stroke-dasharray="5 5"/><path class="link lit" d="M-1560,140C-1560,210,-1430,210,-1430,280" fill="none" stroke="#2e9e5b" stroke-width="2" stroke-dasharray="none"/><text class="edge-label" x="-1495" y="207" text-anchor="middle" font-size="11" fill="#2e7d5b" paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" style="cursor: pointer;">研究因数时你会发现因数还能再分：6 是 …<title>研究因数时你会发现因数还能再分：6 是 12 的因数，但 6 = 2 × 3 还能拆。拆到拆不动，剩下的就是质因数——这正是短除法要找的东西。</title></text><path class="link" d="M-780,140C-780,210,-910,210,-910,280" fill="none" stroke="#c6d2cc" stroke-width="1.5" stroke-dasharray="5 5"/><path class="link lit" d="M-780,140C-780,210,-650,210,-650,280" fill="none" stroke="#2e9e5b" stroke-width="2" stroke-dasharray="none"/><text class="edge-label" x="-715" y="207" text-anchor="middle" font-size="11" fill="#2e7d5b" paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" style="cursor: pointer;">短除法最常见的使用场景：两个数并排短除，…<title>短除法最常见的使用场景：两个数并排短除，把左边共用的质因数乘起来就是最大公因数——约分和化简全靠它。</title></text><path class="link lit" d="M0,140C0,210,-130,210,-130,280" fill="none" stroke="#2e9e5b" stroke-width="2" stroke-dasharray="none"/><text class="edge-label" x="-65" y="207" text-anchor="middle" font-size="11" fill="#2e7d5b" paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" style="cursor: pointer;">试除不能无限进行下去。「商是质数」就是停…<title>试除不能无限进行下去。「商是质数」就是停止信号——质数不能再分解，说明你已经分解到底了。</title></text><path class="link lit" d="M0,140C0,210,130,210,130,280" fill="none" stroke="#2e9e5b" stroke-width="2" stroke-dasharray="none"/><text class="edge-label" x="65" y="207" text-anchor="middle" font-size="11" fill="#2e7d5b" paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" style="cursor: pointer;">分解时你面临的第一个选择是「先除以几」。…<title>分解时你面临的第一个选择是「先除以几」。规则是从最小的质数 2 开始试——这是不遗漏因数、步骤最短的关键。</title></text><path class="link" d="M780,140C780,210,650,210,650,280" fill="none" stroke="#c6d2cc" stroke-width="1.5" stroke-dasharray="5 5"/><path class="link" d="M780,140C780,210,910,210,910,280" fill="none" stroke="#c6d2cc" stroke-width="1.5" stroke-dasharray="5 5"/><path class="link" d="M1560,140C1560,210,1430,210,1430,280" fill="none" stroke="#c6d2cc" stroke-width="1.5" stroke-dasharray="5 5"/><path class="link" d="M1560,140C1560,210,1690,210,1690,280" fill="none" stroke="#c6d2cc" stroke-width="1.5" stroke-dasharray="5 5"/></g><g class="nodes"><g class="node" transform="translate(0,0)"><rect x="-108" y="-32" width="216" height="64" rx="12" fill="#fff6e5" stroke="#2e7d5b" stroke-width="3" filter="url(#card-shadow)" style="cursor: pointer;"/><circle class="state-dot" cx="-92" cy="-17" r="6" fill="#e8930c"/><text x="0" y="7" text-anchor="middle" font-size="14" font-weight="600" fill="#243b33">掌握短除法</text><circle class="collapse-toggle" cx="0" cy="32" r="10" fill="#ffffff" stroke="#b8c4c0" style="cursor: pointer;"/><text x="0" y="35.5" text-anchor="middle" font-size="12" fill="#68766f" style="cursor: pointer;">−</text><title>掌握短除法｜学习中｜双击聚焦</title></g><g class="node" transform="translate(-1560,140)"><rect x="-108" y="-32" width="216" height="64" rx="12" fill="#fdf8e3" stroke="#d4a017" stroke-width="1.5" filter="url(#card-shadow)" style="cursor: pointer;"/><circle class="state-dot" cx="-92" cy="-17" r="6" fill="#d4a017"/><text x="0" y="7" text-anchor="middle" font-size="14" font-weight="600" fill="#243b33">整除与因数</text><circle class="collapse-toggle" cx="0" cy="32" r="10" fill="#ffffff" stroke="#b8c4c0" style="cursor: pointer;"/><text x="0" y="35.5" text-anchor="middle" font-size="12" fill="#68766f" style="cursor: pointer;">−</text><title>整除与因数｜模糊｜双击聚焦</title></g><g class="node" transform="translate(-780,140)"><rect x="-108" y="-32" width="216" height="64" rx="12" fill="#ffffff" stroke="#93a29d" stroke-width="1.5" filter="url(#card-shadow)" style="cursor: pointer;"/><circle class="state-dot" cx="-92" cy="-17" r="6" fill="#93a29d"/><text x="0" y="7" text-anchor="middle" font-size="14" font-weight="600" fill="#243b33">短除法的应用</text><circle class="collapse-toggle" cx="0" cy="32" r="10" fill="#ffffff" stroke="#b8c4c0" style="cursor: pointer;"/><text x="0" y="35.5" text-anchor="middle" font-size="12" fill="#68766f" style="cursor: pointer;">−</text><title>短除法的应用｜未学｜双击聚焦</title></g><g class="node" transform="translate(0,140)"><rect x="-108" y="-32" width="216" height="64" rx="12" fill="#ffffff" stroke="#93a29d" stroke-width="1.5" filter="url(#card-shadow)" style="cursor: pointer;"/><circle class="state-dot" cx="-92" cy="-17" r="6" fill="#93a29d"/><text x="0" y="7" text-anchor="middle" font-size="14" font-weight="600" fill="#243b33">短除法的操作步骤</text><circle class="collapse-toggle" cx="0" cy="32" r="10" fill="#ffffff" stroke="#b8c4c0" style="cursor: pointer;"/><text x="0" y="35.5" text-anchor="middle" font-size="12" fill="#68766f" style="cursor: pointer;">−</text><title>短除法的操作步骤｜未学｜双击聚焦</title></g><g class="node" transform="translate(780,140)"><rect x="-108" y="-32" width="216" height="64" rx="12" fill="#fff6e5" stroke="#e8930c" stroke-width="1.5" filter="url(#card-shadow)" style="cursor: pointer;"/><circle class="state-dot" cx="-92" cy="-17" r="6" fill="#e8930c"/><text x="0" y="7" text-anchor="middle" font-size="14" font-weight="600" fill="#243b33">竖式除法（长除法）</text><circle class="collapse-toggle" cx="0" cy="32" r="10" fill="#ffffff" stroke="#b8c4c0" style="cursor: pointer;"/><text x="0" y="35.5" text-anchor="middle" font-size="12" fill="#68766f" style="cursor: pointer;">−</text><title>竖式除法（长除法）｜学习中｜双击聚焦</title></g><g class="node" transform="translate(1560,140)"><rect x="-108" y="-32" width="216" height="64" rx="12" fill="#e9f7ef" stroke="#2e9e5b" stroke-width="1.5" filter="url(#card-shadow)" style="cursor: pointer;"/><circle class="state-dot" cx="-92" cy="-17" r="6" fill="#2e9e5b"/><text x="0" y="7" text-anchor="middle" font-size="14" font-weight="600" fill="#243b33">除法基本概念</text><circle class="collapse-toggle" cx="0" cy="32" r="10" fill="#ffffff" stroke="#b8c4c0" style="cursor: pointer;"/><text x="0" y="35.5" text-anchor="middle" font-size="12" fill="#68766f" style="cursor: pointer;">−</text><title>除法基本概念｜已掌握｜双击聚焦</title></g><g class="node" transform="translate(-1690,280)"><rect x="-108" y="-32" width="216" height="64" rx="12" fill="#fdf8e3" stroke="#d4a017" stroke-width="1.5" filter="url(#card-shadow)" style="cursor: pointer;"/><circle class="state-dot" cx="-92" cy="-17" r="6" fill="#d4a017"/><text x="0" y="7" text-anchor="middle" font-size="14" font-weight="600" fill="#243b33">质数与合数</text><title>质数与合数｜模糊｜双击聚焦</title></g><g class="node" transform="translate(-1430,280)"><rect x="-108" y="-32" width="216" height="64" rx="12" fill="#ffffff" stroke="#93a29d" stroke-width="1.5" filter="url(#card-shadow)" style="cursor: pointer;"/><circle class="state-dot" cx="-92" cy="-17" r="6" fill="#93a29d"/><text x="0" y="7" text-anchor="middle" font-size="14" font-weight="600" fill="#243b33">质因数</text><title>质因数｜未学｜双击聚焦</title></g><g class="node" transform="translate(-910,280)"><rect x="-108" y="-32" width="216" height="64" rx="12" fill="#ffffff" stroke="#93a29d" stroke-width="1.5" filter="url(#card-shadow)" style="cursor: pointer;"/><circle class="state-dot" cx="-92" cy="-17" r="6" fill="#93a29d"/><text x="0" y="7" text-anchor="middle" font-size="14" font-weight="600" fill="#243b33">分数约分</text><title>分数约分｜未学｜双击聚焦</title></g><g class="node" transform="translate(-650,280)"><rect x="-108" y="-32" width="216" height="64" rx="12" fill="#ffffff" stroke="#93a29d" stroke-width="1.5" filter="url(#card-shadow)" style="cursor: pointer;"/><circle class="state-dot" cx="-92" cy="-17" r="6" fill="#93a29d"/><text x="0" y="7" text-anchor="middle" font-size="14" font-weight="600" fill="#243b33">求最大公因数</text><title>求最大公因数｜未学｜双击聚焦</title></g><g class="node" transform="translate(-130,280)"><rect x="-108" y="-32" width="216" height="64" rx="12" fill="#ffffff" stroke="#93a29d" stroke-width="1.5" filter="url(#card-shadow)" style="cursor: pointer;"/><circle class="state-dot" cx="-92" cy="-17" r="6" fill="#93a29d"/><text x="0" y="7" text-anchor="middle" font-size="14" font-weight="600" fill="#243b33">除到商为质数为止</text><title>除到商为质数为止｜未学｜双击聚焦</title></g><g class="node" transform="translate(130,280)"><rect x="-108" y="-32" width="216" height="64" rx="12" fill="#ffffff" stroke="#93a29d" stroke-width="1.5" filter="url(#card-shadow)" style="cursor: pointer;"/><circle class="state-dot" cx="-92" cy="-17" r="6" fill="#93a29d"/><text x="0" y="7" text-anchor="middle" font-size="14" font-weight="600" fill="#243b33">从最小的质数开始试除</text><title>从最小的质数开始试除｜未学｜双击聚焦</title></g><g class="node" transform="translate(650,280)"><rect x="-108" y="-32" width="216" height="64" rx="12" fill="#e9f7ef" stroke="#2e9e5b" stroke-width="1.5" filter="url(#card-shadow)" style="cursor: pointer;"/><circle class="state-dot" cx="-92" cy="-17" r="6" fill="#2e9e5b"/><text x="0" y="7" text-anchor="middle" font-size="14" font-weight="600" fill="#243b33">一位数除法竖式</text><title>一位数除法竖式｜已掌握｜双击聚焦</title></g><g class="node" transform="translate(910,280)"><rect x="-108" y="-32" width="216" height="64" rx="12" fill="#fff6e5" stroke="#e8930c" stroke-width="1.5" filter="url(#card-shadow)" style="cursor: pointer;"/><circle class="state-dot" cx="-92" cy="-17" r="6" fill="#e8930c"/><text x="0" y="7" text-anchor="middle" font-size="14" font-weight="600" fill="#243b33">多位数除法竖式</text><title>多位数除法竖式｜学习中｜双击聚焦</title></g><g class="node" transform="translate(1430,280)"><rect x="-108" y="-32" width="216" height="64" rx="12" fill="#e9f7ef" stroke="#2e9e5b" stroke-width="1.5" filter="url(#card-shadow)" style="cursor: pointer;"/><circle class="state-dot" cx="-92" cy="-17" r="6" fill="#2e9e5b"/><text x="0" y="7" text-anchor="middle" font-size="14" font-weight="600" fill="#243b33">被除数、除数、商</text><title>被除数、除数、商｜已掌握｜双击聚焦</title></g><g class="node" transform="translate(1690,280)"><rect x="-108" y="-32" width="216" height="64" rx="12" fill="#e9f7ef" stroke="#2e9e5b" stroke-width="1.5" filter="url(#card-shadow)" style="cursor: pointer;"/><circle class="state-dot" cx="-92" cy="-17" r="6" fill="#2e9e5b"/><text x="0" y="7" text-anchor="middle" font-size="14" font-weight="600" fill="#243b33">余数</text><title>余数｜已掌握｜双击聚焦</title></g></g></g></g></svg>