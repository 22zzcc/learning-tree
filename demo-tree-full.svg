<svg xmlns="http://www.w3.org/2000/svg" id="s" viewBox="0 0 2660 560"><defs><filter id="card-shadow" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#1e3c2d" flood-opacity="0.14"/></filter></defs><g class="zoom-group" transform="translate(1330,70) scale(1)"><g class="content-group"><g class="links"><path class="link lit" d="M0,0C0,85,-1140,85,-1140,170" fill="none" stroke="#2e9e5b" stroke-width="2" stroke-dasharray="none"/><text class="edge-label" x="-570" y="82" text-anchor="middle" font-size="10" fill="#2e7d5b" paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" style="cursor: pointer;">做除法时你会注意到：有的算式…<title>做除法时你会注意到：有的算式刚好除尽（余数为 0），有的除不尽——「除得尽」这件事值得专门研究，于是引出了整除与因数。</title></text><path class="link lit" d="M0,0C0,85,-570,85,-570,170" fill="none" stroke="#2e9e5b" stroke-width="2" stroke-dasharray="none"/><text class="edge-label" x="-285" y="82" text-anchor="middle" font-size="10" fill="#2e7d5b" paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" style="cursor: pointer;">短除法本质是一连串除法运算—…<title>短除法本质是一连串除法运算——每一步都在「除以一个数」。先把除法本身彻底弄懂，后面的符号和步骤才不会陌生。</title></text><path class="link lit" d="M0,0C0,85,0,85,0,170" fill="none" stroke="#2e9e5b" stroke-width="2" stroke-dasharray="none"/><text class="edge-label" x="0" y="82" text-anchor="middle" font-size="10" fill="#2e7d5b" paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" style="cursor: pointer;">学会操作只是第一步，真正掌握…<title>学会操作只是第一步，真正掌握要看你会不会用它解决问题——求公因数、公倍数、约分，都是短除法的主场。</title></text><path class="link lit" d="M0,0C0,85,570,85,570,170" fill="none" stroke="#2e9e5b" stroke-width="2" stroke-dasharray="none"/><text class="edge-label" x="285" y="82" text-anchor="middle" font-size="10" fill="#2e7d5b" paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" style="cursor: pointer;">前面所有概念都汇聚到这里：现…<title>前面所有概念都汇聚到这里：现在把它们串成三步连贯动作，这就是短除法本身。</title></text><path class="link lit" d="M0,0C0,85,1140,85,1140,170" fill="none" stroke="#2e9e5b" stroke-width="2" stroke-dasharray="none"/><text class="edge-label" x="570" y="82" text-anchor="middle" font-size="10" fill="#2e7d5b" paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" style="cursor: pointer;">短除法是长除法的「精简版」—…<title>短除法是长除法的「精简版」——先看懂长除法完整的试商、乘、减过程，才能明白短除法省掉了哪些步骤、为什么更快。</title></text><path class="link" d="M-1140,170C-1140,255,-1235,255,-1235,340" fill="none" stroke="#c6d2cc" stroke-width="1.5" stroke-dasharray="5 5"/><path class="link lit" d="M-1140,170C-1140,255,-1045,255,-1045,340" fill="none" stroke="#2e9e5b" stroke-width="2" stroke-dasharray="none"/><text class="edge-label" x="-1092.5" y="252" text-anchor="middle" font-size="10" fill="#2e7d5b" paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" style="cursor: pointer;">研究因数时你会发现因数还能再…<title>研究因数时你会发现因数还能再分：6 是 12 的因数，但 6 = 2 × 3 还能拆。拆到拆不动，剩下的就是质因数——这正是短除法要找的东西。</title></text><path class="link" d="M-570,170C-570,255,-665,255,-665,340" fill="none" stroke="#c6d2cc" stroke-width="1.5" stroke-dasharray="5 5"/><path class="link" d="M-570,170C-570,255,-475,255,-475,340" fill="none" stroke="#c6d2cc" stroke-width="1.5" stroke-dasharray="5 5"/><path class="link" d="M0,170C0,255,-95,255,-95,340" fill="none" stroke="#c6d2cc" stroke-width="1.5" stroke-dasharray="5 5"/><path class="link lit" d="M0,170C0,255,95,255,95,340" fill="none" stroke="#2e9e5b" stroke-width="2" stroke-dasharray="none"/><text class="edge-label" x="47.5" y="252" text-anchor="middle" font-size="10" fill="#2e7d5b" paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" style="cursor: pointer;">短除法最常见的使用场景：两个…<title>短除法最常见的使用场景：两个数并排短除，把左边共用的质因数乘起来就是最大公因数——约分和化简全靠它。</title></text><path class="link lit" d="M570,170C570,255,475,255,475,340" fill="none" stroke="#2e9e5b" stroke-width="2" stroke-dasharray="none"/><text class="edge-label" x="522.5" y="252" text-anchor="middle" font-size="10" fill="#2e7d5b" paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" style="cursor: pointer;">试除不能无限进行下去。「商是…<title>试除不能无限进行下去。「商是质数」就是停止信号——质数不能再分解，说明你已经分解到底了。</title></text><path class="link lit" d="M570,170C570,255,665,255,665,340" fill="none" stroke="#2e9e5b" stroke-width="2" stroke-dasharray="none"/><text class="edge-label" x="617.5" y="252" text-anchor="middle" font-size="10" fill="#2e7d5b" paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" style="cursor: pointer;">分解时你面临的第一个选择是「…<title>分解时你面临的第一个选择是「先除以几」。规则是从最小的质数 2 开始试——这是不遗漏因数、步骤最短的关键。</title></text><path class="link" d="M1140,170C1140,255,1045,255,1045,340" fill="none" stroke="#c6d2cc" stroke-width="1.5" stroke-dasharray="5 5"/><path class="link" d="M1140,170C1140,255,1235,255,1235,340" fill="none" stroke="#c6d2cc" stroke-width="1.5" stroke-dasharray="5 5"/></g><g class="nodes"><g class="node" transform="translate(0,0)"><rect x="-95" y="-28" width="190" height="56" rx="10" fill="#fff6e5" stroke="#2e7d5b" stroke-width="3" filter="url(#card-shadow)" style="cursor: pointer;"/><circle class="state-dot" cx="-80" cy="-15" r="6" fill="#e8930c"/><text x="0" y="7" text-anchor="middle" font-size="14" font-weight="600" fill="#243b33">掌握短除法</text><circle class="collapse-toggle" cx="0" cy="28" r="9" fill="#ffffff" stroke="#b8c4c0" style="cursor: pointer;"/><text x="0" y="31" text-anchor="middle" font-size="11" fill="#68766f" style="cursor: pointer;">−</text><title>掌握短除法｜学习中｜双击聚焦</title></g><g class="node" transform="translate(-1140,170)"><rect x="-24" y="-62" width="48" height="124" rx="10" fill="#fdf8e3" stroke="#d4a017" stroke-width="1.5" filter="url(#card-shadow)" style="cursor: pointer;"/><text x="0" y="-48" text-anchor="middle" font-size="10" font-weight="700" fill="#68766f">1</text><text x="0" y="-30" text-anchor="middle" font-size="14" font-weight="600" fill="#243b33">整</text><text x="0" y="-14" text-anchor="middle" font-size="14" font-weight="600" fill="#243b33">除</text><text x="0" 