"-108" y="-32" width="216" height="64" rx="12" fill="#ffffff" stroke="#93a29d" stroke-width="1.5" filter="url(#card-shadow)" style="cursor: pointer;"/><circle class="state-dot" cx="-92" cy="-17" r="6" fill="#93a29d"/><text x="0" y="7" text-anchor="middle" font-size="14" font-weight="600" fill="#243b33">质因数</text><title>质因数｜未学｜双击聚焦</title></g></g></g></g></svg>