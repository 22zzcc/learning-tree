<svg xmlns="http://www.w3.org/2000/svg" id="s" viewBox="0 0 700 560"><defs><filter id="card-shadow" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="1" stdDeviation="2.5" flood-color="#1e3c2d" flood-opacity="0.06"/></filter></defs><g class="zoom-group" transform="translate(320,70) scale(1)"><g class="content-group"><g class="links"><path class="link" d="M30,62C30,85,-30,85,-30,108" fill="none" stroke="#d1d1d6" stroke-width="1.2" stroke-dasharray="3 4"/><path class="link lit" d="M30,62C30,93,150,93,150,124" fill="none" stroke="#2e9e5b" stroke-width="1.6" stroke-dasharray="4 4"/><text class="edge-label" x="90" y="90" text-anchor="middle" font-size="10" fill="#2e7d5b" paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" style="cursor: pointer;">研究因数时你会发现因数还…<title>研究因数时你会发现因数还能再分：6 是 12 的因数，但 6 = 2 × 3 还能拆。拆到拆不动，剩下的就是质因数——这正是短除法要找的东西。</title></text></g><g class="nodes"><g class="node" data-depth="0" transform="translate(30,0)"><rect x="-32" y="-62" width="64" height="124" rx="14" fill="#f5f5f7" stroke="#2e9e5b" stroke-width="2.5" filter="url(#card-shadow)" style="cursor: pointer;"/><text x="0" y="-36" text-anchor="middle" font-size="15" font-weight="500" fill="#1d1d1f">整</text><text x="0" y="-20" text-anchor="middle" font-size="15" font-weight="500" fill="#1d1d1f">除</text><text x="0" y="-4" text-anchor="middle" font-size="15" font-weight="500" fill="#1d1d1f">与</text><text x="0" y="12" text-anchor="middle" font-size="15" font-weight="500" fill="#1d1d1f">因</text><text x="0" y="28" text-anchor="middle" font-size="15" font-weight="500" fill="#1d1d1f">数</text><circle class="state-dot" cx="0" cy="48" r="5" fill="#d4a017"/><rect class="mastery-bar" x="-28" y="59.5" width="14" height="2.5" rx="1.25" fill="#d4a017"/><circle class="collapse-toggle" cx="0" cy="62" r="9" fill="#ffffff" stroke="#d1d1d6" style="cursor: pointer;"/><text x="0" y="65" text-anchor="middle" font-size="11" fill="#8e8e93" style="cursor: pointer;">−</text><title>整除与因数｜模糊｜双击聚焦</title></g><g class="node" data-depth="1" transform="translate(-30,170)"><rect x="-24" y="-62" width="48" height="124" rx="14" fill="#fdf9ec" stroke="none" stroke-width="0" filter="url(#card-shadow)" style="cursor: pointer;"/><text x="0" y="-48" text-anchor="middle" font-size="9.5" font-weight="600" fill="#8e8e93">1</text><text x="0" y="-30" text-anchor="middle" font-size="13.5" font-weight="500" fill="#1d1d1f">质</text><text x="0" y="-14" text-anchor="middle" font-size="13.5" font-weight="500" fill="#1d1d1f">数</text><text x="0" y="2" text-anchor="middle" font-size="13.5" font-weight="500" fill="#1d1d1f">与</text><text x="0" y="18" text-anchor="middle" font-size="13.5" font-weight="500" fill="#1d1d1f">合</text><text x="0" y="34" text-anchor="middle" font-size="13.5" font-weight="500" fill="#1d1d1f">数</text><circle class="state-dot" cx="0" cy="48" r="5" fill="#d4a017"/><rect class="mastery-bar" x="-20" y="59.5" width="10" height="2.5" rx="1.25" fill="#d4a017"/><title>质数与合数｜模糊｜双击聚焦</title></g><g class="node" data-depth="1" transform="translate(150,170)"><rect x="-24" y="-46" width="48" height="92" rx="14" fill="#ffffff" stroke="none" stroke-width="0" filter="url(#card-shadow)" style="cursor: pointer;"/><text x="0" y="-32" text-anchor="middle" font-size="9.5" font-weight="600" fill="#8e8e93">2</text><text x="0" y="-14" text-anchor="middle" font-size="13.5" font-weight="500" fill="#1d1d1f">质</text><text x="0" y="2" text-anchor="middle" font-size="13.5" font-weight="500" fill="#1d1d1f">因</text><text x="0" y="18" text-anchor="middle" font-size="13.5" font-weight="500" fill="#1d1d1f">数</text><circle class="state-dot" cx="0" cy="32" r="5" fill="#93a29d"/><rect class="mastery-bar" x="-20" y="43.5" width="0" height="2.5" rx="1.25" fill="#93a29d"/><title>质因数｜未学｜双击聚焦</title></g></g></g></g></svg>