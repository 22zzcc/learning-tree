<svg xmlns="http://www.w3.org/2000/svg" id="s" viewBox="0 0 700 560"><defs><filter id="card-shadow" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="1" stdDeviation="2.5" flood-color="#1e3c2d" flood-opacity="0.06"/></filter></defs><g class="zoom-group" transform="translate(320,70) scale(1)"><g class="content-group"><g class="links"><path class="link lit" d="M30,86C30,77,-30,77,-30,68" fill="none" stroke="#2e9e5b" stroke-width="1.6" stroke-dasharray="4 4"/><text class="edge-label" x="0" y="74" text-anchor="middle" font-size="10" fill="#2e7d5b" paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" style="cursor: pointer;">分解时你面临的第一个选择…<title>分解时你面临的第一个选择是「先除以几」。规则是从最小的质数 2 开始试——这是不遗漏因数、步骤最短的关键。</title></text><path class="link lit" d="M30,86C30,85,150,85,150,84" fill="none" stroke="#2e9e5b" stroke-width="1.6" stroke-dasharray="4 4"/><text class="edge-label" x="90" y="82" text-anchor="middle" font-size="10" fill="#2e7d5b" paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" style="cursor: pointer;">试除不能无限进行下去。「…<title>试除不能无限进行下去。「商是质数」就是停止信号——质数不能再分解，说明你已经分解到底了。</title></text></g><g class="nodes"><g class="node" data-depth="0" transform="translate(30,0)"><rect x="-32" y="-86" width="64" height="172" rx="14" fill="#f5f5f7" stroke="#2e9e5b" stroke-width="2.5" filter="url(#card-shadow)" style="cursor: pointer;"/><text x="0" y="-60" text-anchor="middle" font-size="15" font-weight="500" fill="#1d1d1f">短</text><text x="0" y="-44" text-anchor="middle" font-size="15" font-weight="500" fill="#1d1d1f">除</text><text x="0" y="-28" text-anchor="middle" font-size="15" font-weight="500" fill="#1d1d1f">法</text><text x="0" y="-12" text-anchor="middle" font-size="15" font-weight="500" fill="#1d1d1f">的</text><text x="0" y="4" text-anchor="middle" font-size="15" font-weight="500" fill="#1d1d1f">操</text><text x="0" y="20" text-anchor="middle" font-size="15" font-weight="500" fill="#1d1d1f">作</text><text x="0" y="36" text-anchor="middle" font-size="15" font-weight="500" fill="#1d1d1f">步</text><text x="0" y="52" text-anchor="middle" font-size="15" font-weight="500" fill="#1d1d1f">骤</text><circle class="state-dot" cx="0" cy="72" r="5" fill="#93a29d"/><rect class="mastery-bar" x="-28" y="83.5" width="0" height="2.5" rx="1.25" fill="#93a29d"/><circle class="collapse-toggle" cx="0" cy="86" r="9" fill="#ffffff" stroke="#d1d1d6" style="cursor: pointer;"/><text x="0" y="89" text-anchor="middle" font-size="11" fill="#8e8e93" style="cursor: pointer;">−</text><title>短除法的操作步骤｜未学｜双击聚焦</title></g><g class="node" data-depth="1" transform="translate(-30,170)"><rect x="-24" y="-102" width="48" height="204" rx="14" fill="#ffffff" stroke="none" stroke-width="0" filter="url(#card-shadow)" style="cursor: pointer;"/><text x="0" y="-88" text-anchor="middle" font-size="9.5" font-weight="600" fill="#8e8e93">1</text><text x="0" y="-70" text-anchor="middle" font-size="13.5" font-weight="500" fill="#1d1d1f">从</text><text x="0" y="-54" text-anchor="middle" font-size="13.5" font-weight="500" fill="#1d1d1f">最</text><text x="0" y="-38" text-anchor="middle" font-size="13.5" font-weight="500" fill="#1d1d1f">小</text><text x="0" y="-22" text-anchor="middle" font-size="13.5" font-weight="500" fill="#1d1d1f">的</text><text x="0" y="-6" text-anchor="middle" font-size="13.5" font-weight="500" fill="#1d1d1f">质</text><text x="0" y="10" text-anchor="middle" font-size="13.5" font-weight="500" fill="#1d1d1f">数</text><text x="0" y="26" text-anchor="middle" font-size="13.5" font-weight="500" fill="#1d1d1f">开</text><text x="0" y="42" text-anchor="middle" font-size="13.5" font-weight="500" fill="#1d1d1f">始</text><text x="0" y="58" text-anchor="middle" font-size="13.5" font-weight="500" fill="#1d1d1f">试</text><text x="0" y="74" text-anchor="middle" font-size="13.5" font-weight="500" fill="#1d1d1f">除</text><circle class="state-dot" cx="0" cy="88" r="5" fill="#93a29d"/><rect class="mastery-bar" x="-20" y="99.5" width="0" height="2.5"