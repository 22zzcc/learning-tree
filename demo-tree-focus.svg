<svg xmlns="http://www.w3.org/2000/svg" id="s" viewBox="0 0 800 560"><defs><filter id="card-shadow" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#1e3c2d" flood-opacity="0.14"/></filter></defs><g class="zoom-group" transform="translate(400,80) scale(1)"><g class="content-group"><g class="links"><path class="link lit" d="M0,0C0,70,-130,70,-130,140" fill="none" stroke="#2e9e5b" stroke-width="2" stroke-dasharray="none"/><text class="edge-label" x="-65" y="67" text-anchor="middle" font-size="11" fill="#2e7d5b" paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" style="cursor: pointer;">试除不能无限进行下去。「商是质数」就是停…<title>试除不能无限进行下去。「商是质数」就是停止信号——质数不能再分解，说明你已经分解到底了。</title></text><path class="link lit" d="M0,0C0,70,130,70,130,140" fill="none" stroke="#2e9e5b" stroke-width="2" stroke-dasharray="none"/><text class="edge-label" x="65" y="67" text-anchor="middle" font-size="11" fill="#2e7d5b" paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" style="cursor: pointer;">分解时你面临的第一个选择是「先除以几」。…<title>分解时你面临的第一个选择是「先除以几」。规则是从最小的质数 2 开始试——这是不遗漏因数、步骤最短的关键。</title></text></g><g class="nodes"><g class="node" transform="translate(0,0)"><rect x="-108" y="-32" width="216" height="64" rx="12" fill="#ffffff" stroke="#2e7d5b" stroke-width="3" filter="url(#card-shadow)" style="cursor: pointer;"/><circle class="state-dot" cx="-92" cy="-17" r="6" fill="#93a29d"/><text x="0" y="7" text-anchor="middle" font-size="14" font-weight="600" fill="#243b33">短除法的操作步骤</text><circle class="collapse-toggle" cx="0" cy="32" r="10" fill="#ffffff" stroke="#b8c4c0" style="cursor: pointer;"/><text x="0" y="35.5" text-anchor="middle" font-size="12" fill="#68766f" style="cursor: pointer;">−</text><title>短除法的操作步骤｜未学｜双击聚焦</title></g><g class="node" transform="translate(-130,140)"><rect x="-108" y="-32" width="216" height="64" rx="12" fill="#ffffff" stroke="#93a29d" stroke-width="1.5" filter="url(#card-shadow)" style="cursor: pointer;"/><circle class="state-dot" cx="-92" cy="-17" r="6" fill="#93a29d"/><text x="0" y="7" text-anchor="middle" font-size="14" font-weight="600" fill="#243b33">除到商为质数为止</text><title>除到商为质数为止｜未学｜双击聚焦</title></g><g class="node" transform="translate(130,140)"><rect x="-108" y="-32" width="216" height="64" rx="12" fill="#ffffff" stroke="#93a29d" stroke-width="1.5" filter="url(#card-shadow)" style="cursor: pointer;"/><circle class="state-dot" cx="-92" cy="-17" r="6" fill="#93a29d"/><text x="0" y="7" text-anchor="middle" font-size="14" font-weight="600" fill="#243b33">从最小的质数开始试除</text><title>从最小的质数开始试除｜未学｜双击聚焦</title></g></g></g></g></svg>